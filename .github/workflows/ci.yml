name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Droits minimaux (alerte CodeQL actions/missing-workflow-permissions,
# 17/10/2026) : le job ne fait que lire le code et lancer les vérifications.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: ./node_modules/.bin/tsc --noEmit

      - run: npm test
